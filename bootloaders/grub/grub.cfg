# =============================================================================
# Lumina Linux — GRUB config (used when GRUB is selected as bootloader)
# =============================================================================
# Note: archiso's actual bootloader is syslinux (BIOS) + systemd-boot (UEFI)
# for the live ISO. This GRUB config is a fallback / for installed systems.
# =============================================================================

set default=0
set timeout=5
set pager=1

insmod all_video
insmod gfxterm
insmod gfxterm_background
insmod part_msdos
insmod part_gpt
insmod ext2
insmod btrfs
insmod fat
insmod iso9660
insmod usbms
insmod progress

loadfont /boot/grub/fonts/unicode.pf2

set gfxmode=auto
set gfxpayload=keep
terminal_input console
terminal_output gfxterm

# Lumina GRUB theme
if [ -f /boot/grub/themes/lumina/theme.txt ]; then
    set theme=/boot/grub/themes/lumina/theme.txt
fi

menuentry "Boot Lumina Linux (x86_64, UEFI)" --class lumina --class linux {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=LUMINA_%ARCHISO_LABEL_SUF%
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Boot Lumina Linux (NVIDIA proprietary)" --class lumina --class linux {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=LUMINA_%ARCHISO_LABEL_SUF% nvidia-drm.modeset=1 modprobe.black=nouveau
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Boot Lumina Linux (Safe Graphics Mode)" --class lumina --class linux {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=LUMINA_%ARCHISO_LABEL_SUF% nomodeset
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Power Off" --class shutdown {
    halt
}

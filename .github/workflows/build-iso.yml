# =============================================================================
# Lumina Linux — ISO Build Pipeline
# =============================================================================
# Triggers:
#   - Push of a tag matching v*.*.*   ->  builds the ISO and publishes a Release
#   - Manual dispatch from Actions tab ->  builds the ISO, uploads as a workflow
#                                            artifact (no release published)
#
# Runner: ubuntu-latest inside an archlinux:latest container (we need pacman +
# archiso which are not packaged for Ubuntu). The container runs unprivileged;
# mkarchiso does not need root inside the container for squashfs creation.
#
# Build time budget:
#   - Cold cache (first run): ~45–75 min (well under the 6-hour job limit)
#   - Warm cache (subsequent runs with same package list): ~15–25 min
#     * pacman deps:        ~3 min   (all cached)
#     * AUR builds:         ~2 min   (all cached — makepkg skipped)
#     * ISO pacstrap+mkiso: ~10 min  (pacman pkgs cached, mkarchiso still runs)
#     * image upload+release: ~2 min
# Disk usage: ~10 GB peak (well under the 14 GB runner SSD limit).
# =============================================================================

name: Build ISO

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release (only applies to tag pushes; ignored here)'
        required: false
        default: 'false'

# Cancel any superseded run on the same ref (saves Actions minutes).
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed by softprops/action-gh-release to create releases

jobs:
  build:
    name: Build Lumina Linux ISO
    runs-on: ubuntu-latest
    # v0.1.8: Hard 60-min job timeout. Previous builds ran 1h15min before being
    # manually cancelled — that's wasted Actions minutes. The v0.1.8 build
    # should finish in 20-30 min cold cache, 10-15 min warm cache. If we hit
    # 60 min, something is genuinely broken (network, mirror, keyring) and we
    # should abort instead of grinding for hours.
    timeout-minutes: 60
    container:
      image: archlinux:latest
      # mkarchiso calls pacstrap, which calls arch-chroot, which bind-mounts
      # /proc, /sys, /dev, /run into the install root. Those mounts require
      # CAP_SYS_ADMIN, which the default Actions container does NOT have.
      # `--privileged` is the simplest way to grant all the capabilities
      # mkarchiso needs (mount, losetup for squashfs, etc.).
      # This is the standard approach used by every archiso-on-GHA project.
      options: --privileged

    steps:
      # ---------- 1. Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 1b. Restore pacman package cache ----------
      # pacman stores every downloaded .pkg.tar.zst in /var/cache/pacman/pkg/.
      # On a cache hit, `pacman -S` uses the cached file directly (no re-download).
      # Keyed on the package list hash so the cache refreshes when the list changes;
      # restore-keys lets us fall back to a stale-but-mostly-correct cache on a miss,
      # which still saves the bulk of the download bandwidth.
      #
      # IMPORTANT: we use actions/cache/restore (NOT actions/cache) so the save
      # happens via an EXPLICIT actions/cache/save step later in the workflow
      # with `if: always()`. The default actions/cache post-step is unreliable
      # when the job fails partway through (it doesn't always run inside a
      # container after a failed step). This is why v0.1.4 saved ZERO caches
      # even though it ran for 75 minutes.
      - name: Restore pacman package cache
        id:   pacman-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-v1-${{ hashFiles('packages.x86_64') }}
          restore-keys: |
            pacman-v1-

      # ---------- 1c. Restore AUR built-packages cache ----------
      # /tmp/lumina-repo holds the .pkg.tar.zst files produced by the previous
      # successful run. build-aur-packages.sh checks for each package by name
      # and skips the makepkg step entirely if a cached artifact exists.
      # Keyed on the build script hash so any logic change invalidates the cache.
      - name: Restore AUR build cache
        id:   aur-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/lumina-repo
          key: aur-repo-v1-${{ hashFiles('scripts/build-aur-packages.sh') }}
          restore-keys: |
            aur-repo-v1-

      # ---------- 1d. Debug: show what was restored ----------
      # This is critical for diagnosing cache issues — without it we can't tell
      # whether a slow build is due to a cache miss or a real AUR build.
      - name: Show cache state after restore
        run: |
          echo "=== Pacman cache restore result: ${{ steps.pacman-cache-restore.outputs.cache-hit }} ==="
          echo "=== AUR repo cache restore result: ${{ steps.aur-cache-restore.outputs.cache-hit }} ==="
          echo ""
          echo "=== /var/cache/pacman/pkg contents (if any) ==="
          ls -lh /var/cache/pacman/pkg/ 2>/dev/null | head -20 || echo "  (empty or doesn't exist)"
          echo ""
          echo "=== /tmp/lumina-repo contents (if any) ==="
          ls -lh /tmp/lumina-repo/ 2>/dev/null || echo "  (empty or doesn't exist)"

      # ---------- 2. Refresh Arch keyring + system + base build deps ----------
      - name: Install build dependencies
        run: |
          # The archlinux container ships without an initialized keyring.
          # Initialize it BEFORE running pacman -Syu, otherwise the upgrade
          # will fail signature verification.
          pacman-key --init || true
          pacman-key --populate archlinux || true

          # Install sudo first (needed by build-aur-packages.sh's builder user)
          pacman -Sy --noconfirm --needed sudo

          # Install/refresh the archlinux-keyring FIRST. The container's
          # keyring may be stale, which causes pacman to reject packages
          # signed with newer keys (surfacing as spurious 'target not found'
          # errors during mkarchiso's pacstrap step).
          pacman -S --noconfirm --needed archlinux-keyring

          # Full system upgrade + the tools mkarchiso and makepkg need.
          # --overwrite is needed because archlinux container sometimes has
          # conflicting files between the base image and the new packages.
          pacman -Syu --noconfirm --needed --overwrite '*' \
            base-devel \
            git \
            curl \
            wget \
            rsync \
            archiso \
            grub \
            dosfstools \
            mtools \
            squashfs-tools \
            libisoburn \
            pacman-contrib \
            pkgconf \
            patch \
            diffutils \
            python \
            python-pip \
            perl \
            ruby \
            rust \
            go \
            cmake \
            ninja \
            meson \
            vala \
            gobject-introspection \
            appstream-glib \
            intltool \
            itstool \
            docbook-xsl \
            imagemagick \
            ttf-dejavu \
            ttf-liberation \
            gsfonts

      # ---------- 3. Configure git identity (needed by makepkg for SRCINFO) ----------
      - name: Configure git
        run: |
          git config --global --add safe.directory '*'
          git config --global user.email "ci@lumina-linux.local"
          git config --global user.name  "Lumina CI"

      # ---------- 4. Create a non-root builder (makepkg refuses root) ----------
      - name: Create builder user
        run: |
          useradd -m -G wheel -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      # ---------- 4b. Generate mirrorlist (v0.1.8 fix for "target not found") ----------
      # The archlinux:latest Docker image SOMETIMES ships with an empty or
      # stale /etc/pacman.d/mirrorlist. When that happens, every [extra]
      # package is reported as "target not found" by pacstrap even though
      # the database downloads. This step guarantees a working mirrorlist.
      # We also hardcode the mirror URL in pacman.conf as a primary source,
      # so this is a belt-and-suspenders fallback.
      - name: Generate mirrorlist
        run: |
          echo "=== Current mirrorlist state ==="
          if [ -f /etc/pacman.d/mirrorlist ]; then
            wc -l /etc/pacman.d/mirrorlist
            head -5 /etc/pacman.d/mirrorlist
          else
            echo "  (does not exist — creating)"
          fi

          echo ""
          echo "=== Generating fresh mirrorlist via reflector ==="
          # Pick the 5 most up-to-date HTTPS mirrors in the global pool.
          # Use --sort age (most recently synced) for reliability.
          # The 2-min timeout prevents this step from hanging on bad networks.
          timeout 120 reflector \
            --latest 20 \
            --sort age \
            --protocol https \
            --save /etc/pacman.d/mirrorlist || {
              echo "WARNING: reflector failed — writing fallback mirror directly"
              mkdir -p /etc/pacman.d
              echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
            }

          echo ""
          echo "=== New mirrorlist ==="
          cat /etc/pacman.d/mirrorlist
          echo ""
          echo "=== Verifying pacman can see [extra] packages ==="
          pacman -Sy --noconfirm
          pacman -Ss '^mtools$' || echo "  WARNING: mtools not found in [extra] — mirrorlist may still be broken"
          pacman -Ss '^zenity$' || echo "  WARNING: zenity not found in [extra] — mirrorlist may still be broken"

      # ---------- 5. Build AUR packages into a local repo ----------
      # The local repo is later referenced by pacman.conf and consumed by
      # mkarchiso's pacstrap. Packages that fail to build are skipped with a
      # warning so the ISO can still be produced (with reduced functionality).
      #
      # v0.1.8: Hard 20-min timeout. The v0.1.7 list (with bottles, calamares,
      # protonup-qt — 30+ min source builds each) ran for 1h15min before being
      # manually cancelled. The v0.1.8 list (8 fast-build packages) should
      # finish in 10-15 min cold, 1-2 min warm. If we exceed 20 min, something
      # is wrong and we abort instead of burning Actions minutes.
      - name: Build AUR packages
        timeout-minutes: 20
        run: |
          chmod +x scripts/build-aur-packages.sh
          bash scripts/build-aur-packages.sh

      # ---------- 5b. Save AUR build cache (always, even on failure) ----------
      # CRITICAL: this runs with `if: always()` so the cache is saved even if
      # the build fails later. Without this, a 75-minute AUR build phase would
      # have to be repeated on every retry. The `continue-on-error: true` is
      # because actions/cache/save fails if the exact key already exists
      # (which is fine — it means the cache is already up to date).
      - name: Save AUR build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/lumina-repo
          key: aur-repo-v1-${{ hashFiles('scripts/build-aur-packages.sh') }}

      # ---------- 5c. Debug: show AUR build results ----------
      - name: Show AUR repo contents
        if: always()
        run: |
          echo "=== /tmp/lumina-repo contents after AUR build ==="
          ls -lh /tmp/lumina-repo/ 2>/dev/null || echo "  (empty or doesn't exist)"
          echo ""
          echo "=== Total size ==="
          du -sh /tmp/lumina-repo/ 2>/dev/null || true

      # ---------- 6. Generate placeholder branding assets ----------
      # These are simple PNG/SVG placeholders so the ISO builds even before
      # the user drops in real logo/wallpaper designs. Replace before release.
      - name: Generate branding assets
        run: |
          chmod +x scripts/generate-branding-assets.sh
          bash scripts/generate-branding-assets.sh

      # ---------- 7. Enable systemd services in airootfs ----------
      # Creates symlinks under airootfs/etc/systemd/system/ so NetworkManager,
      # lightdm, bluetooth, etc. auto-start when the live ISO boots.
      - name: Enable systemd services
        run: |
          chmod +x scripts/setup-services.sh
          bash scripts/setup-services.sh

      # ---------- 8. Build the ISO with mkarchiso ----------
      - name: Build ISO
        run: |
          # mkarchiso needs an absolute path to a writable workdir.
          mkdir -p work out
          mkarchiso -v -w "$(pwd)/work" -o "$(pwd)/out" .

          # Show what we produced
          ls -lah out/

      # ---------- 9. Compute metadata + checksums ----------
      - name: Rename ISO and generate checksum
        id: meta
        run: |
          # Determine version string (tag name or nightly timestamp)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # Find the produced ISO (archiso names it <iso_name>-<version>-x86_64.iso)
          ISO_SRC=$(ls out/*.iso | head -n1)
          ISO_DST="out/lumina-${VERSION}-x86_64.iso"
          mv "$ISO_SRC" "$ISO_DST"

          # SHA256 checksum
          cd out
          sha256sum "$(basename "$ISO_DST")" > "$(basename "$ISO_DST").sha256sum"
          cd ..
          ls -lah out/

      # ---------- 10. Upload as workflow artifact (always, even on manual run) ----------
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-iso-${{ steps.meta.outputs.VERSION }}
          path: |
            out/*.iso
            out/*.sha256sum
          retention-days: 14
          compression-level: 0   # ISO is already compressed; no point re-compressing

      # ---------- 9b. Trim pacman cache before it gets re-saved ----------
      # Keep only the latest version of each cached package. This prevents the
      # cache from growing unboundedly across runs as Arch packages get upgraded.
      # `pacman-contrib` is installed in step 2; paccache ships with it.
      - name: Trim pacman cache (keep latest only)
        if: always()
        run: |
          paccache -r -k 1 --cachedir /var/cache/pacman/pkg || true
          # Also drop any orphan files (e.g. removed-from-list packages)
          du -sh /var/cache/pacman/pkg || true

      # ---------- 9c. Save pacman cache (always, even on failure) ----------
      # Same rationale as the AUR cache save — explicit save with `if: always()`
      # so the cache is preserved across runs even if the build fails later.
      - name: Save pacman package cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-v1-${{ hashFiles('packages.x86_64') }}

      # ---------- 11. Publish GitHub Release (only on tag push) ----------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumina Linux ${{ github.ref_name }}
          body: |
            # Lumina Linux ${{ github.ref_name }}

            ## Download
            - **ISO:** `lumina-${{ steps.meta.outputs.VERSION }}-x86_64.iso`
            - **Checksum:** `lumina-${{ steps.meta.outputs.VERSION }}-x86_64.iso.sha256sum`

            ## Verify
            ```bash
            sha256sum -c lumina-${{ steps.meta.outputs.VERSION }}-x86_64.iso.sha256sum
            ```

            ## Write to USB
            ```bash
            sudo dd if=lumina-${{ steps.meta.outputs.VERSION }}-x86_64.iso \
              of=/dev/sdX bs=4M status=progress conv=fsync
            ```
            (Replace `/dev/sdX` with your USB device. Use `lsblk` to identify it.)

            ## System Requirements
            - 64-bit x86 CPU (Intel or AMD)
            - 2 GB RAM (4 GB recommended)
            - 20 GB free disk space
            - USB flash drive (4 GB+)

            ## First Boot
            1. Boot from the USB
            2. Click **Install Lumina** on the desktop to launch the installer
            3. Follow the guided install wizard
            4. Reboot into your new Lumina system

            ## What's New
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: |
            out/*.iso
            out/*.sha256sum
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false

#
# /etc/pacman.conf
#
# Lumina Linux — BUILD-TIME pacman configuration.
# This file is used by `mkarchiso` to install packages into the airootfs.
#
# - Enables [multilib] for 32-bit gaming libraries (Steam, Wine)
# - Adds the local [lumina] repo containing AUR packages built fresh by
#   scripts/build-aur-packages.sh (placed in /tmp/lumina-repo)
# - Uses 4 parallel downloads for faster builds
#
# NOTE: This file is ALSO copied into the ISO as /etc/pacman.conf by mkarchiso.
# The [lumina] entry points to /tmp/lumina-repo which only exists during build.
# At runtime on the installed system, the entry will be unreachable but
# harmless — pacman just prints a warning and continues. For a cleaner
# runtime experience, see airootfs/etc/pacman.conf which overrides this
# with a runtime-only config (no [lumina] entry).
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
ParallelDownloads = 4
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- Lumina local AUR repo (built fresh by CI for each release) ---
# Path matches where scripts/build-aur-packages.sh writes its output.
[lumina]
SigLevel = Optional TrustAll
Server   = file:///tmp/lumina-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

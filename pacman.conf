#
# /etc/pacman.conf
#
# Lumina Linux — BUILD-TIME pacman configuration.
# Used by `mkarchiso` to install packages into the airootfs.
#
# v0.1.8 changes:
#   - Hardcoded mirror URL as a SAFETY NET. The archlinux:latest Docker image
#     sometimes ships with an empty /etc/pacman.d/mirrorlist, which causes
#     pacstrap to report "target not found" for EVERY package even though
#     the databases appear to download. Hardcoding the mirror here removes
#     that variable entirely.
#   - Still uses Include for the runtime mirrorlist as a SECONDARY source
#     via the URL fallback — pacman tries each Server in order.
#
# The [lumina] entry points to /tmp/lumina-repo which only exists during
# build. At runtime on the installed system, the entry will be unreachable
# but harmless — pacman just prints a warning and continues. For a cleaner
# runtime experience, see airootfs/etc/pacman.conf which overrides this
# with a runtime-only config (no [lumina] entry).
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
ParallelDownloads = 4
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- Lumina local AUR repo (built fresh by CI for each release) ---
# Path matches where scripts/build-aur-packages.sh writes its output.
# Only packages that successfully build end up here. If the directory is
# empty (no successful builds), pacman will warn but continue.
[lumina]
SigLevel = Optional TrustAll
Server   = file:///tmp/lumina-repo

# --- Official Arch repos ---
# Hardcoded mirror as primary source (avoids empty-mirrorlist issues
# in the archlinux:latest Docker container). The geo mirror redirects to
# the closest fast mirror based on source IP.
[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

# =============================================================================
# Lumina Linux — mkinitcpio.conf
# =============================================================================
# Live ISO initramfs configuration. Optimized for fast boot + broad hardware
# support. The 'booster' alternative initramfs is also installed as a fallback.
# =============================================================================

MODULES=(udev)
BINARIES=()
FILES=()

# Hooks order matters: base first, then block, then filesystems last.
# `archiso` is required for the live ISO to find its squashfs payload.
HOOKS=(base udev modconf kms block filesystems keyboard fsck archiso_shutdown archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_kms)

COMPRESSION="xz"
COMPRESSION_OPTIONS=(-Xbcj x86 -b 1M -Xdict-size 1M)

# =============================================================================
# Lumina Linux — picom compositor configuration
# =============================================================================
# This produces the Windows 11 "acrylic" / macOS "frosted glass" effect:
#   - Background blur behind transparent windows (dual_kawase, fastest)
#   - Soft drop shadows on all windows
#   - Subtle inactive-window dimming
#   - Smooth fade transitions on open/close
#
# Tuned for low GPU load on Intel/AMD integrated graphics.
# =============================================================================

backend = "glx";
vsync = true;

# ---------- Shadow ----------
shadow = true;
shadow-radius = 12;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.55;
shadow-exclude = [
  "class_g = 'lightdm-gtk-greeter'",
  "class_g *= 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---------- Fading ----------
fading = true;
fade-in-step = 0.10;
fade-out-step = 0.10;
fade-exclude = [];

# ---------- Transparency / opacity ----------
# Active windows are fully opaque. Inactive windows drop to 90% so the user
# can tell focus at a glance without losing readability.
inactive-opacity = 0.90;
active-opacity = 1.0;
frame-opacity = 0.85;
inactive-opacity-override = false;
inactive-dim = 0.05;

# ---------- Blur (Windows 11 acrylic effect) ----------
# dual_kawase is the fastest blur method; tuned for integrated GPUs.
blur: {
  method = "dual_kawase";
  strength = 6;
  background = false;
  background-frame = true;
  background-fixed = false;
  kern = "3x3box";
};

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---------- Window-type rules ----------
# Keep the desktop (icons) opaque and unblurred; blur panels & menus.
wintypes:
{
  normal     = { fade = true; shadow = true; };
  dialog     = { fade = true; shadow = true; opacity = 0.95; };
  utility    = { fade = true; shadow = true; opacity = 0.90; };
  popup_menu = { fade = true; shadow = true; opacity = 0.85; };
  dropdown_menu = { fade = true; shadow = true; opacity = 0.85; };
  tooltip    = { fade = true; shadow = true; opacity = 0.85; };
  notification = { fade = true; shadow = true; opacity = 0.85; };
  combo      = { fade = true; shadow = false; opacity = 0.85; };
  dnd        = { fade = true; shadow = false; };
  dock       = { fade = false; shadow = false; };
  desktop    = { fade = false; shadow = false; opacity = 1.0; blur = false; };
  toolbar    = { fade = true; shadow = true; opacity = 0.90; };
  menu       = { fade = true; shadow = true; opacity = 0.85; };
  splash     = { fade = true; shadow = true; opacity = 1.0; };
  unknown    = { fade = true; shadow = true; };
};

# ---------- Per-app rules ----------
opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Code'",
  "100:class_g = 'libreoffice'",
  "85:class_g = 'xfce4-panel'",
  "85:class_g = 'whiskermenu-1'",
  "85:class_g = 'Plank'",
  "85:class_g = 'Docky'",
  "85:name    = 'File Operations'"
];

blur-rule = [
  "class_g = 'xfce4-panel'",
  "class_g = 'whiskermenu-1'",
  "class_g = 'rofi'",
  "class_g = 'Rofi'",
  "class_g = 'Plank'",
  "class_g = 'Docky'",
  "class_g = 'Gnome-pie'",
  "name     = 'File Operations'"
];

# ---------- Performance ----------
# These keep idle CPU usage near 0 (matches the distro's <100 MB RAM target).
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
xrender-sync-fence = true;
unredir-if-possible = false;       # don't disable compositing for fullscreen
unredir-if-possible-exclude = [];

# ---------- Misc ----------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0;
dbe = false;
paint-on-overlay = true;
sw-opti = false;

# ---------- Focus ----------
focus-exclude = [
  "class_g = 'lightdm-gtk-greeter'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Notify-osd'"
];

# ---------- Corner rounding (modern look) ----------
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Polybar'"
];
round-borders = 1;

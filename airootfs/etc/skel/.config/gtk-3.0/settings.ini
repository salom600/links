[Settings]
# Lumina Linux — GTK 3 settings
# Theme + icon theme + font are duplicated here so GTK3 apps pick them up
# even before xfsettingsd has started (e.g. during lightdm greeter).

gtk-theme-name=Fluent
gtk-icon-theme-name=Tela-blue
gtk-font-name=Inter 10
gtk-cursor-theme-name=Premium
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=false
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=1
gtk-menu-images=1
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-xft-dpi=98304
gtk-decoration-layout=menu:minimize,maximize,close
gtk-dialogs-use-header=1
gtk-key-theme-name=Default
gtk-color-scheme=prefer-light

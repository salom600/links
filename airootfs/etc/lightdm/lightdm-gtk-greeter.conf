# =============================================================================
# Lumina Linux — LightDM GTK Greeter configuration
# =============================================================================
# This is the login screen shown before the user enters XFCE.
# Mirrors the Win11 lock screen aesthetic:
#   - Dark blurred wallpaper background
#   - Centered login dialog with rounded corners
#   - Modern font (Inter)
#   - Clock top-right, sessions/power bottom-right
# =============================================================================

[greeter]
background = /usr/share/backgrounds/lumina/lumina-login.jpg
user-background = false
theme-name = Fluent
icon-theme-name = Tela-blue
font-name = Inter 10
font-weight = 500
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
xft-dpi = 96
default-user-image = /usr/share/backgrounds/lumina/lumina-user.png
round-user-image = true
hide-user-image = false
screensaver-timeout = 60

[branding]
logo = /usr/share/backgrounds/lumina/lumina-logo.png
logo-opacity = 0.85

# Position the login panel in the center, like Win11
[position]
center = true

# Show clock top-right, sessions/power bottom-right
[indicators]
a11y = true
session = true
power = true
clock = true
language = false
host = false

[clock]
format = %H:%M
position = top-right

[session]
position = bottom-right

[power]
position = bottom-right
show-uptime = false

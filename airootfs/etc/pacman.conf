#
# /etc/pacman.conf
#
# Lumina Linux — RUNTIME pacman configuration (ships inside the ISO).
#
# This is the config users see after install. It does NOT include the
# [lumina] local AUR repo (that only exists during ISO build, at
# /tmp/lumina-repo, and isn't shipped with the installed system).
#
# AUR packages are instead accessed via the included helpers:
#   - pamac-aur  (GUI app store)
#   - paru-bin   (CLI helper)
# Both connect to the AUR directly and build packages on demand.
#
# Flathub is added automatically by first-boot.sh for Flatpak support.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
Color
VerbosePkgLists
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

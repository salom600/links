# Lumina Linux — Calamares partition module
---
# Allow the user to choose their partitioning scheme interactively.
# Default scheme: GPT for UEFI systems, MBR for BIOS.
defaultPartitionTableType: gpt

# Enable these schemes (user can pick):
allowManualPartitioning: true
enableSwapPartitions: true
swapChoice: small   # small = 1x RAM, suspend = 2x RAM, etc.

# LUKS support (let users encrypt their disk)
allowLuks: true

# Available choices for "Erase disk" automatic mode
eraseOptions:
  - erase
  - replace

# Filesystem choices offered to the user
availableFilesystems:
  - ext4
  - btrfs
  - xfs
  - f2fs
  - ntfs

# Default filesystem for new installs
defaultFileSystemType: btrfs

# Btrfs subvolume layout (similar to openSUSE / Fedora)
btrfsSubvolumes:
  - name: '@'
    mountpoint: '/'
  - name: '@home'
    mountpoint: '/home'
  - name: '@var'
    mountpoint: '/var'
  - name: '@snapshots'
    mountpoint: '/.snapshots'

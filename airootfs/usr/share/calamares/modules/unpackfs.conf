# Lumina Linux — Calamares unpackfs module
# This copies the live ISO's squashfs into the new root filesystem.
---
# Source: the live ISO's squashfs payload
unpack:
  - source: /run/archiso/bootmnt/arch/x86_64/airootfs.sfs
    sourcefs: squashfs
    destination: ""

# Also unpack the desktopfs if present (Lumina doesn't use this, but keep for compat)
stress: false

# Lumina Linux — Calamares grubcfg module
---
# Edit GRUB config to use Lumina branding and enable os-prober.
defaultBg: /usr/share/backgrounds/lumina/lumina-grub.png
distribution: Lumina

# Enable os-prober so Windows shows up in GRUB
probe: true

# Use a fixed GRUB_TIMEOUT so the menu doesn't disappear too fast
timeout: 5

# Lumina Linux — Calamares displaymanager module
# Configures LightDM as the installed system's login greeter.
---
displaymanagers:
  - lightdm

# Autologin the user created during install (they explicitly opted in via users.conf)
defaultDesktopEnvironment:
  desktop: xfce
  executable: startxfce4

# Set the user as the autologin user
autoLoginUser: ""

# Basic LightDM config
lightdmCfgPath: /etc/lightdm/lightdm.conf

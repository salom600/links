# Lumina Linux — Calamares packages module
# Installs additional packages onto the target system using pacman.
# (The base system was already copied via unpackfs.)
---
packageOperations:
  - install:
      - lumina-base          # meta-package (defined in /usr/local/repo/lumina)
      - pamac-aur
      - paru-bin
      - firefox
      - libreoffice-fresh
      - vlc
      - discord
      - steam
      - gamemode
      - mangohud
      - wine
      - winetricks
      - bottles
      - protonup-qt
      - flatpak
      - fluent-gtk-theme-git
      - tela-icon-theme-git
      - grub
      - os-prober
      - snapper
      - btrfs-assistant
      - reflector
      - timeshift
      - keepassxc

# Use the local AUR repo that we built during ISO creation
packagedeps: []

# Use the Lumina-branded pacman.conf (preserves multilib + AUR repo)
tempDir: /tmp/calamares-packages

# Don't fail if a package is missing — log and continue
skipIfUnavailable: true

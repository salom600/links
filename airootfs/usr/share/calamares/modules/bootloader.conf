# Lumina Linux — Calamares bootloader module
---
# Install GRUB as the bootloader (handles both BIOS and UEFI).
efiBootLoader: grub
kernel: /boot/vmlinuz-linux
initramfs: /boot/initramfs-linux.img

# Where to install GRUB on BIOS systems (user picks during install)
# On UEFI, this is ignored.
# installBootloader: /dev/sda

# Always use the proper bootloader for the current firmware
useFirmware: true

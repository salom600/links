# Lumina Linux — Calamares users module
---
# Allow the user to create their account during install.
userShell: /bin/bash

# Don't set a default user — let the user pick.
# The 'autologin' field will be set based on the user's choice.
doAutologin: true

# Set the root password to be the same as the user's password by default
setRootPassword: false

# Use sudo group for admin rights
sudoersGroup: wheel

# Default user's avatar (optional, leave empty)
userAvatar: /usr/share/backgrounds/lumina/lumina-user.png

# Don't enforce password strength — let users pick (with warning)
passwordChecks:
  - minLength: 6
  - nonEmpty: true

# Allow reuse of the user password as root password
allowWeakPasswords: true
doPasswordChecks: true

# Lumina Linux — Calamares services-systemd module
# Enable the listed systemd services on the installed system.
---
services:
  - NetworkManager
  - lightdm
  - bluetooth
  - firewalld
  - tlp
  - avahi-daemon
  - systemd-timesyncd
  - upower
  - thermald
  - pamac-cleancache.timer
  - reflector.timer
  - snapper-cleanup.timer
  - snapper-timeline.timer

disable: []
mask: []

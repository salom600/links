# =============================================================================
# Lumina Linux — Calamares main settings
# =============================================================================
# Controls the sequence of modules shown during install.
# Mode: don't chmod +x — Calamares reads this file directly.
# =============================================================================

# Branding component (must match directory under /usr/share/calamares/branding/)
branding: lumina

# Don't show the prompt to do "Do you really want to install?" — too naggy
prompt-install: false

# Don't quit Calamares automatically after install — let user verify
dont-chroot: false

# Sequence of modules (each runs in order shown)
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - fstab
      - localecfg
      - keyboardcfg
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - luksbootkeyfile
      - plymouthcfg
      - initramfscfg
      - removeuser
      - initramfs
      - machineid
      - fstab
      - finished

# Branch modes (default is "live")
# 'live' means: source system is the running live ISO.
# 'no-udev' means: don't rely on udev being available.
branch-mode: live

# Show a feedback screen at the end
show-feedback: true

# Allow cancel during install (we allow it — let users abort if they need to)
cancel-installer: true
